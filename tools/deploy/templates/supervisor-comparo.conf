; Comparo Performance — supervisor program definitions.
;
; Copy to /etc/supervisor/conf.d/comparo-<env>.conf, replace every
; <PLACEHOLDER>, then `supervisorctl reread && supervisorctl update`.
; See docs/operations/staging.md and config/horizon.php ("staging"
; supervisors — Horizon manages its own worker pool once started here).

[program:comparo-<env>-horizon]
process_name=%(program_name)s
command=php <DEPLOY_ROOT>/current/artisan horizon
directory=<DEPLOY_ROOT>/current
autostart=true
autorestart=true
user=<DEPLOY_USER>
redirect_stderr=true
stdout_logfile=<DEPLOY_ROOT>/shared/storage/logs/horizon.log
; Horizon needs time to let running jobs finish before the process manager
; sends SIGKILL — must exceed the longest queue timeout (900s pricing/matching/
; feed-import jobs, config/queue.php "redis-long").
stopwaitsecs=960
stopsignal=TERM

[program:comparo-<env>-inertia-ssr]
process_name=%(program_name)s
command=php <DEPLOY_ROOT>/current/artisan inertia:start-ssr
directory=<DEPLOY_ROOT>/current
autostart=true
autorestart=true
user=<DEPLOY_USER>
redirect_stderr=true
stdout_logfile=<DEPLOY_ROOT>/shared/storage/logs/inertia-ssr.log
stopsignal=TERM

[program:comparo-<env>-scheduler]
process_name=%(program_name)s
; schedule:work runs the scheduler loop in the foreground instead of a cron
; entry firing `schedule:run` every minute — use one or the other, not both.
command=php <DEPLOY_ROOT>/current/artisan schedule:work
directory=<DEPLOY_ROOT>/current
autostart=true
autorestart=true
user=<DEPLOY_USER>
redirect_stderr=true
stdout_logfile=<DEPLOY_ROOT>/shared/storage/logs/scheduler.log
stopsignal=TERM

[group:comparo-<env>]
programs=comparo-<env>-horizon,comparo-<env>-inertia-ssr,comparo-<env>-scheduler

; --- Cron alternative to the [program:comparo-<env>-scheduler] block above ---
; If you prefer cron over a supervised schedule:work loop, drop that program
; and add this line to the deploy user's crontab instead (`crontab -e`):
;
; * * * * * cd <DEPLOY_ROOT>/current && php artisan schedule:run >> <DEPLOY_ROOT>/shared/storage/logs/schedule-cron.log 2>&1

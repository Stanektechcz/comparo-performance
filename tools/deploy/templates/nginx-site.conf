# Comparo Performance — nginx site template (php-fpm 8.4).
#
# Copy to /etc/nginx/sites-available/comparo-<env>.conf, replace every
# <PLACEHOLDER>, symlink into sites-enabled, then `nginx -t && systemctl
# reload nginx`. See docs/operations/staging.md.
#
# client_max_body_size matches comparo.feeds.max_payload_bytes (100 MiB,
# config/comparo.php) plus headroom for multipart overhead.

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name <SERVER_NAME>;

    location /.well-known/acme-challenge/ {
        root <ACME_CHALLENGE_ROOT>;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <SERVER_NAME>;

    root <DEPLOY_ROOT>/current/public;
    index index.php;

    ssl_certificate     <TLS_CERT_PATH>;
    ssl_certificate_key <TLS_KEY_PATH>;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 110M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/xml+rss image/svg+xml font/woff2;

    # Deny dotfiles (.env, .git, etc.) anywhere under the document root.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Long cache for hashed Vite build assets.
    location /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";

        fastcgi_param HTTPS on;
        fastcgi_param X_FORWARDED_PROTO $scheme;

        include fastcgi_params;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/comparo-<ENV>-access.log;
    error_log  /var/log/nginx/comparo-<ENV>-error.log;
}

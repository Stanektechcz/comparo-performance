name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: comparo_test
          POSTGRES_USER: comparo
          POSTGRES_PASSWORD: comparo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comparo -d comparo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node (prototype parity exporter)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Syntax check
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Prototype specification is unchanged
        run: php artisan comparo:verify-prototype

      - name: Prototype parity fixtures are current
        run: node tools/prototype-parity/export-fixtures.mjs --check

      - name: Tests (SQLite)
        if: matrix.database == 'sqlite'
        run: php artisan test --compact

      - name: Tests (PostgreSQL 16)
        if: matrix.database == 'pgsql'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: comparo_test
          DB_USERNAME: comparo
          DB_PASSWORD: comparo
        run: php artisan test --compact

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP (Wayfinder route generation)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Type check
        run: npm run types:check

      - name: Lint and format check
        run: npm run check

      - name: Build (client + SSR)
        run: npm run build:ssr
